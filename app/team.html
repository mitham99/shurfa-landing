<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; object-src 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A2E28">
  <title>تسجيل فريق — بطولة الورقة | SQU إيييت على شُرفة</title>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body>
  <header class="app-top">
    <a class="app-brand" href="../index.html"><img src="../assets/img/brand/monogram-160.png" alt="">شُرفة</a>
    <a class="app-event" href="../squ-eat.html"><img src="../assets/img/events/squ-eat-logo.jpg" alt="">SQU إيييت</a>
  </header>

  <main class="app-wrap">
    <section class="card" id="notReady" hidden>
      <h2>التسجيل قيد التجهيز</h2>
      <p class="sub">سيُفتح التسجيل قريبًا.</p>
    </section>

    <section id="teamView" hidden>
      <div class="card hero-card">
        <h2>بطولة الورقة 🃏</h2>
        <p class="sub">ورقة، بلوت، مشترى… دوّر لك ربيع لعيب وسجّل! نظام لعب تيمات. الجوائز: الأول 100 ريال، الثاني 50 ريال.</p>
      </div>
      <form class="card" id="teamForm" novalidate>
        <div id="teamMsg"></div>
        <label class="field"><span>اسم الفريق</span><input name="team" required maxlength="40"></label>
        <label class="field"><span>اللعبة</span>
          <select name="game" required><option value="">اختر</option><option>ورقة</option><option>بلوت</option><option>مشترى</option></select>
        </label>
        <div class="row2">
          <label class="field"><span>اللاعب الأول</span><input name="p1" required maxlength="60" autocomplete="name"></label>
          <label class="field"><span>هاتفه</span><input name="p1p" required type="tel" inputmode="tel" dir="ltr"></label>
        </div>
        <div class="row2">
          <label class="field"><span>اللاعب الثاني</span><input name="p2" required maxlength="60"></label>
          <label class="field"><span>هاتفه</span><input name="p2p" required type="tel" inputmode="tel" dir="ltr"></label>
        </div>
        <label class="consent"><input type="checkbox" name="consent" required><span>نوافق على استخدام بياناتنا لتنظيم البطولة والتواصل بخصوصها فقط. <a href="privacy.html">سياسة الخصوصية</a></span></label>
        <button class="btn btn-primary btn-block" type="submit" id="teamBtn">سجّل الفريق</button>
      </form>
      <div class="card" id="doneView" hidden>
        <div class="msg ok" id="doneMsg"></div>
        <a class="btn btn-gold btn-block" href="index.html">احصل على جوازك الرقمي أيضًا</a>
      </div>
    </section>
  </main>

  <footer class="app-foot">شُرفة · <a href="privacy.html">الخصوصية</a></footer>

  <script src="../assets/js/config.js?v=50"></script>
  <script src="app.js?v=1"></script>
  <script src="team.js?v=1"></script>
</body>
</html>
